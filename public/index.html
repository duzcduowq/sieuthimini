<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Thị Mini 4.0 - Nguyễn Văn Bút</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #005088; --accent: #11CAA0; --orange: #ff5722; --light: #f4f6f9; --dark: #2c3e50; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--light); color: #333; }
        
        header { background-color: var(--primary); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 22px; font-weight: bold; }
        .auth-container { display: flex; gap: 8px; align-items: center; }
        .auth-container input { padding: 6px 10px; border-radius: 4px; border: none; outline: none; width: 120px; font-size: 12px; }
        .btn-auth { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-reg { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .main-container { display: flex; max-width: 1200px; margin: 20px auto; padding: 0 20px; gap: 20px; flex-wrap: wrap; }
        .products-section { flex: 3; min-width: 300px; }
        .cart-section { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 100px; }

        .category-buttons { margin-bottom: 20px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .btn-cat { padding: 8px 18px; border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 20px; cursor: pointer; font-weight: 500; white-space: nowrap; }
        .btn-cat.active { background: var(--primary); color: white; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #eef2f5; text-align: center; }
        .product-card img { width: 100%; height: 130px; object-fit: contain; margin-bottom: 10px; }
        .product-card h3 { font-size: 14px; height: 35px; overflow: hidden; margin-bottom: 8px; }
        .product-card .price { color: var(--orange); font-weight: bold; margin-bottom: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 8px; border-radius: 4px; cursor: pointer; }

        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
        .cart-total { margin-top: 15px; font-weight: bold; color: var(--orange); font-size: 18px; text-align: right; }
        .btn-checkout { background: var(--accent); color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; margin-top: 15px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:10px; width:90%; max-width:450px; position:relative; }
        .modal-content input, .modal-content textarea { width:100%; padding:10px; margin: 8px 0; border:1px solid #ddd; border-radius:5px; }
        
        footer { background: var(--dark); color: white; padding: 40px 5%; margin-top: 50px; line-height: 1.8; }
    </style>
</head>
<body>

<header>
    <div class="logo">🏪 SIÊU THỊ MINI 4.0</div>
    <div class="auth-container" id="auth-ui">
        <input type="text" id="user-input" placeholder="Tên đăng nhập">
        <input type="password" id="pass-input" placeholder="Mật khẩu">
        <button class="btn-reg" onclick="handleRegister()">ĐĂNG KÝ</button>
        <button class="btn-auth" onclick="handleLogin()">ĐĂNG NHẬP</button>
    </div>
</header>

<div class="main-container">
    <div class="products-section">
        <div class="category-buttons">
            <button class="btn-cat active" onclick="filterProducts(this, 'Tất cả')">Tất cả</button>
            <button class="btn-cat" onclick="filterProducts(this, 'Đồ Ăn')">Đồ ăn</button>
            <button class="btn-cat" onclick="filterProducts(this, 'Đồ Uống')">Đồ uống</button>
            <button class="btn-cat" onclick="filterProducts(this, 'Đồ Gia Dụng')">Gia dụng</button>
        </div>
        <div class="product-grid" id="product-grid"></div>
    </div>

    <div class="cart-section">
        <h3>🛒 Giỏ hàng (<span id="user-name-display">Khách</span>)</h3>
        <div id="cart-items"><p style="text-align:center; color:#999; padding:20px;">Trống</p></div>
        <div class="cart-total">Tổng: <span id="cart-total">0 đ</span></div>
        <button class="btn-checkout" onclick="openCheckout()">ĐẶT HÀNG</button>
    </div>
</div>

<div id="checkout-modal" class="modal">
    <div class="modal-content">
        <span onclick="closeCheckout()" style="position:absolute; right:15px; top:10px; cursor:pointer; font-size:20px;">&times;</span>
        <div id="step-info">
            <h3 style="text-align:center; color:var(--primary); margin-bottom:15px;">THÔNG TIN GIAO HÀNG</h3>
            <input type="text" id="cust_name" placeholder="Họ tên khách hàng">
            <input type="tel" id="cust_phone" placeholder="Số điện thoại">
            <textarea id="cust_address" placeholder="Địa chỉ giao hàng"></textarea>
            <button class="btn-checkout" onclick="processPayment()">XÁC NHẬN & HIỆN QR</button>
        </div>
        <div id="step-qr" style="display:none; text-align:center;">
            <h3 style="color:var(--accent)">THANH TOÁN VIETQR</h3>
            <img id="qr-image" src="" style="width:200px; margin:15px 0; border:1px solid #eee;">
            <div style="font-weight:bold; color:var(--orange); margin-bottom:15px;">Tổng tiền: <span id="qr-final-amount">0</span>đ</div>
            <button class="btn-add" style="background:#005088; margin-bottom:10px;" id="btn-pdf-download" onclick="xuatHoaDonPDF()">📄 TẢI HÓA ĐƠN PDF</button>
            <button class="btn-add" style="background:#95a5a6;" onclick="location.reload()">HOÀN TẤT</button>
        </div>
    </div>
</div>

<footer>
    <div style="display:flex; flex-wrap:wrap; gap:40px; justify-content: space-between;">
        <div style="flex:1; min-width:250px;">
            <h3>HỆ THỐNG SIÊU THỊ 4.0</h3>
            <p>Báo cáo đồ án chuyên ngành - Nhóm 3 UNETI</p>
        </div>
        <div style="flex:1; min-width:250px;">
            <h3 id="contact-heading">THÔNG TIN LIÊN HỆ</h3>
            <p>👤 Nguyễn Văn Bút | 📞 0397742349</p>
            <p>📍 107 Lương Văn Can, TP. Nam Định</p>
            <p>📧 butcon2k5@gmail.com</p>
        </div>
    </div>
</footer>

<script>
    // 1. DỮ LIỆU SẢN PHẨM (Khớp tên file ảnh)
    const tatCaSanPham = [
        {id:1, name:'Mì Hảo Hảo', price:5000, category:'Đồ Ăn', image:'image/mi.jpg'},
        {id:2, name:'Gạo ST25 5kg', price:150000, category:'Đồ Ăn', image:'image/gao.jpg'},
        {id:3, name:'Trứng gà (10 quả)', price:32000, category:'Đồ Ăn', image:'image/trung.jpg'},
        {id:4, name:'Snack khoai tây', price:12000, category:'Đồ Ăn', image:'image/snack.jpg'},
        {id:5, name:'Banh mì Sandwich', price:32000, category:'Đồ Ăn', image:'image/banhmi.jpg'},
        {id:6, name:'Xúc xích Vissan', price:45000, category:'Đồ Ăn', image:'image/xucxich.jpg'},
        {id:7, name:'Thịt bò Úc 500g', price:180000, category:'Đồ Ăn', image:'image/thitbo.jpg'},
        {id:8, name:'Rau cải ngọt 1kg', price:20000, category:'Đồ Ăn', image:'image/rau.jpg'},
        {id:9, name:'Cà chua Đà Lạt', price:25000, category:'Đồ Ăn', image:'image/cachua.jpg'},
        {id:10, name:'Táo Mỹ 1kg', price:65000, category:'Đồ Ăn', image:'image/tao.jpg'},
        {id:11, name:'Coca Cola 330ml', price:10000, category:'Đồ Uống', image:'image/coca.jpg'},
        {id:12, name:'Sữa tươi 1L', price:35000, category:'Đồ Uống', image:'image/sua.jpg'},
        {id:13, name:'Nước suối Lavie', price:5000, category:'Đồ Uống', image:'image/nuocsuoi.jpg'},
        {id:14, name:'Trà Ô Long', price:12000, category:'Đồ Uống', image:'image/traolong.jpg'},
        {id:15, name:'Bia Heineken', price:18000, category:'Đồ Uống', image:'image/bia.jpg'},
        {id:16, name:'Nước cam ép', price:40000, category:'Đồ Uống', image:'image/nuoccam.jpg'},
        {id:17, name:'Cà phê lon', price:15000, category:'Đồ Uống', image:'image/caphe.jpg'},
        {id:18, name:'Nước tăng lực', price:13000, category:'Đồ Uống', image:'image/tangluc.jpg'},
        {id:19, name:'Nước ép táo', price:42000, category:'Đồ Uống', image:'image/eptao.jpg'},
        {id:20, name:'Trà đào cam sả', price:30000, category:'Đồ Uống', image:'image/tradao.jpg'},
        {id:21, name:'Nước mắm Chinsu', price:45000, category:'Đồ Gia Dụng', image:'image/nuocmam.jpg'},
        {id:22, name:'Dầu ăn Tường An', price:55000, category:'Đồ Gia Dụng', image:'image/dauan.jpg'},
        {id:23, name:'Bột giặt Omo', price:145000, category:'Đồ Gia Dụng', image:'image/botgiat.jpg'},
        {id:24, name:'Nước rửa chén', price:35000, category:'Đồ Gia Dụng', image:'image/ruachen.jpg'},
        {id:25, name:'Giấy vệ sinh', price:60000, category:'Đồ Gia Dụng', image:'image/giay.jpg'},
        {id:26, name:'Kem đánh răng', price:32000, category:'Đồ Gia Dụng', image:'image/kemdanhrang.jpg'},
        {id:27, name:'Dầu gội Romano', price:120000, category:'Đồ Gia Dụng', image:'image/daugoi.jpg'},
        {id:28, name:'Sữa tắm Lifebuoy', price:95000, category:'Đồ Gia Dụng', image:'image/suatam.jpg'},
        {id:29, name:'Nước lau sàn', price:45000, category:'Đồ Gia Dụng', image:'image/lausan.jpg'},
        {id:30, name:'Nước xả vải', price:85000, category:'Đồ Gia Dụng', image:'image/xavai.jpg'}
    ];

    let dbUsers = JSON.parse(localStorage.getItem('users')) || {};
    let activeUser = "Khách";
    let gioHang = [];

    function handleRegister() {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        if(!u || !p) return alert("Vui lòng nhập đủ!");
        dbUsers[u] = p;
        localStorage.setItem('users', JSON.stringify(dbUsers));
        alert("Đăng ký thành công!");
    }

    function handleLogin() {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        if(dbUsers[u] === p) {
            activeUser = u;
            document.getElementById('user-name-display').innerText = u;
            document.getElementById('auth-ui').innerHTML = `<span><i class="fas fa-user"></i> ${u}</span>`;
            alert("Đăng nhập thành công!");
        } else alert("Sai thông tin!");
    }

    function renderProducts(list) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = list.map(p => `
            <div class="product-card">
                <img src="${p.image}" onerror="this.src='https://via.placeholder.com/150'">
                <h3>${p.name}</h3>
                <div class="price">${p.price.toLocaleString()} đ</div>
                <button class="btn-add" onclick="themVaoGio(${p.id})">Thêm vào giỏ</button>
            </div>
        `).join('');
    }

    function filterProducts(btn, cat) {
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(cat === 'Tất cả' ? tatCaSanPham : tatCaSanPham.filter(p => p.category === cat));
    }

    function themVaoGio(id) {
        const sp = tatCaSanPham.find(p => p.id === id);
        const item = gioHang.find(i => i.id === id);
        if(item) item.qty++; else gioHang.push({...sp, qty: 1});
        updateCart();
    }

    function updateCart() {
        const container = document.getElementById('cart-items');
        if(gioHang.length === 0) container.innerHTML = '<p style="text-align:center; padding:20px;">Trống</p>';
        else container.innerHTML = gioHang.map(i => `<div class="cart-item"><span>${i.name} (x${i.qty})</span><b>${(i.price * i.qty).toLocaleString()}đ</b></div>`).join('');
        const total = gioHang.reduce((s, i) => s + (i.price * i.qty), 0);
        document.getElementById('cart-total').innerText = total.toLocaleString() + ' đ';
    }

    function openCheckout() {
        if(gioHang.length === 0) return alert("Giỏ hàng trống!");
        document.getElementById('checkout-modal').style.display = 'flex';
    }
    function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

    function processPayment() {
        const n = document.getElementById('cust_name').value;
        const p = document.getElementById('cust_phone').value;
        if(!n || !p) return alert("Vui lòng nhập đủ tên và SĐT!");
        const total = gioHang.reduce((s, i) => s + (i.price * i.qty), 0);
        document.getElementById('qr-image').src = `https://img.vietqr.io/image/MB-0397742349-compact2.png?amount=${total}&addInfo=ThanhToan_${p}&accountName=NGUYEN%20VAN%20BUT`;
        document.getElementById('qr-final-amount').innerText = total.toLocaleString();
        document.getElementById('step-info').style.display = 'none';
        document.getElementById('step-qr').style.display = 'block';
    }

    // --- HÀM XUẤT PDF ĐÃ FIX LỖI TRẮNG TRANG ---
    function xuatHoaDonPDF() {
        const btn = document.getElementById('btn-pdf-download');
        btn.innerText = "Đang tạo PDF...";
        btn.disabled = true;

        const name = document.getElementById('cust_name').value;
        const phone = document.getElementById('cust_phone').value;
        const addr = document.getElementById('cust_address').value;
        const total = gioHang.reduce((s, i) => s + (i.price * i.qty), 0);
        
        // Tạo chuỗi HTML sạch cho PDF
        const pdfContent = `
            <div style="padding:30px; font-family:Arial; line-height:1.6; color:#333;">
                <div style="text-align:center; margin-bottom:20px;">
                    <h1 style="color:#005088; margin:0;">SIÊU THỊ MINI 4.0</h1>
                    <p style="margin:5px 0;">Mã đơn: DH-${Date.now().toString().slice(-6)}</p>
                </div>
                
                <div style="margin-bottom:20px; border:1px solid #eee; padding:15px; border-radius:8px;">
                    <p><b>Khách hàng:</b> ${name}</p>
                    <p><b>Số điện thoại:</b> ${phone}</p>
                    <p><b>Địa chỉ:</b> ${addr}</p>
                    <p><b>Ngày mua:</b> ${new Date().toLocaleString()}</p>
                </div>

                <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                    <tr style="background:#005088; color:white;">
                        <th style="padding:10px; border:1px solid #ddd; text-align:left;">Sản phẩm</th>
                        <th style="padding:10px; border:1px solid #ddd; text-align:center;">SL</th>
                        <th style="padding:10px; border:1px solid #ddd; text-align:right;">Thành tiền</th>
                    </tr>
                    ${gioHang.map(i => `
                        <tr>
                            <td style="padding:10px; border:1px solid #ddd;">${i.name}</td>
                            <td style="padding:10px; border:1px solid #ddd; text-align:center;">${i.qty}</td>
                            <td style="padding:10px; border:1px solid #ddd; text-align:right;">${(i.price*i.qty).toLocaleString()}đ</td>
                        </tr>
                    `).join('')}
                </table>

                <h2 style="text-align:right; color:#ff5722; margin-top:20px;">TỔNG CỘNG: ${total.toLocaleString()}đ</h2>

                <div style="margin-top:40px; padding:20px; background:#f4f6f9; border-radius:8px;">
                    <h3 style="margin-top:0; color:#005088;">THÔNG TIN SHOP</h3>
                    <p>👤 <b>Chủ sở hữu:</b> Nguyễn Văn Bút</p>
                    <p>📞 <b>Hotline/Zalo:</b> 0397742349</p>
                    <p>📍 <b>Địa chỉ:</b> 107 Lương Văn Can, TP. Nam Định</p>
                    <p>📧 <b>Email:</b> butcon2k5@gmail.com</p>
                </div>
            </div>
        `;

        const opt = {
            margin: 10,
            filename: `HoaDon_${name}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Chờ 0.5s để chắc chắn nội dung sẵn sàng rồi mới xuất
        setTimeout(() => {
            html2pdf().from(pdfContent).set(opt).save().then(() => {
                btn.innerText = "📄 TẢI HÓA ĐƠN PDF";
                btn.disabled = false;
            });
        }, 500);
    }

    window.onload = () => renderProducts(tatCaSanPham);
</script>
</body>
</html>
